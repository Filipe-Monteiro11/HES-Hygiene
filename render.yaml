services:
  - type: web
    name: hesatacado
    runtime: python
    plan: free

    rootDir: backend

    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput

    startCommand: gunicorn config.wsgi:application

    autoDeploy: false

    envVars:
      - key: PYTHON_VERSION
        value: "3.13.0"

      - key: SECRET_KEY
        sync: false

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        sync: false

      - key: CSRF_TRUSTED_ORIGINS
        sync: false

      - key: NEON_DB_NAME
        value: hes_atacado

      - key: NEON_DB_USER
        value: hes_atacado_owner

      - key: NEON_DB_PASSWORD
        sync: false

      - key: NEON_DB_HOST
        sync: false

      - key: NEON_DB_PORT
        value: "5432"

      - key: IMAGEKIT_URL_ENDPOINT
        value: https://ik.imagekit.io/mnzlvr7n9

      - key: IMAGEKIT_PRIVATE_KEY
        sync: false